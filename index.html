<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript" src="http://livejs.com/live.js"></script>
    <title>GET BLEAK</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Tahoma, sans-serif;
      }

      body {
        height: 100dvh;
        background-color: black;
        display: grid;
        grid-template-rows: 1fr 1fr 1fr;
      }

      .row {
        display: grid;
        width: 100%;
      }

      .row2 {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .row3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .column {
        display: flex;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
      }

      #logo {
        width: 90dvw;
        max-width: 1200px;
      }

      a {
        color: white;
      }
      a:visited {
        color: pink;
      }
      a:hover {
        color: hotpink;
      }

    </style>
  </head>
  <body>
    <div class="row row1"></div>
    <div class="row row2">
      <img id="logo" src="logo white.png" alt="">
    </div>
    <div class="row row3">
      <div class="column">
        <div>
          <a href="https://www.instagram.com/bleak.enterprise">INSTAGRAM</a>
        </div>
      </div>
      <div class="column">
        <div>
          <a href="https://bleakenterprise.bandcamp.com">BANDCAMP</a>
        </div>
      </div>
    </div>
  </body>
</html>
